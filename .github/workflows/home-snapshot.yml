# Home snapshot: every 6 hours, home/<tab>.json from Megaplay's own tabs (scripts/home-snapshot.mjs), for Da-Video's Contenido.
# Commits as xuper-plugin, and only when a tab changed.
name: Home snapshot
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/home-snapshot.mjs
        env:
          KINO_TMDB_KEY: ${{ secrets.KINO_TMDB_KEY }}
      - name: Commit the snapshot
        run: |
          git add home
          if git diff --cached --quiet; then echo "Home unchanged"; exit 0; fi
          git -c user.name=xuper-plugin -c user.email=335105665+xuper-plugin@users.noreply.github.com commit -q -m "Home snapshot"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
